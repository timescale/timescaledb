  # The latest published release is the version the E2E test upgrades from.
  get_previous_tag:
    name: Get previous timescaledb release tag
    runs-on: runs-on/fleet=linux-2cpu/env=ue1
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Get latest timescaledb tag
        id: get_tag
        env:
          GH_TOKEN: ${{ secrets.ORG_AUTOMATION_TOKEN || github.token }}
        run: |
          LATEST_TAG="$(gh api "repos/timescale/timescaledb/releases/latest" --jq '.tag_name')"

          if [ -z "$LATEST_TAG" ]; then
            echo "::error::Could not determine the latest release tag"
            exit 1
          fi
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

