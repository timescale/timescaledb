# Check our codebase for defective programming patterns
name: Coccinelle
"on":
  pull_request:
  push:
    branches:
      - main
      - ?.*.x
jobs:
  coccinelle:
    name: Coccinelle
    runs-on: runs-on/fleet=linux-2cpu-x64/env=ue1

    steps:
    - uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0

    - name: Replace unreliable Azure APT mirror
      run: |
        sudo touch /etc/apt/apt-mirrors.txt
        sudo sed -i.bak -e s,azure.archive.ubuntu,aws.archive.ubuntu,g /etc/apt/apt-mirrors.txt
        # On RunsOn (AWS) runners, switch to the regional EC2 mirror since
        # archive.ubuntu.com throttles concurrent downloads from AWS.
        for f in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
          if [ -f "$f" ]; then
            sudo sed -i.bak -E 's,https?://(archive|security)\.ubuntu\.com/ubuntu,http://'"${RUNS_ON_AWS_REGION:-us-east-1}"'.ec2.archive.ubuntu.com/ubuntu,g' "$f"
          fi
        done

    - name: Configure apt retries and timeout
      run: |
        # retry more, allow longer timeouts, and try acquire by hash first
        sudo sh -c "echo 'Acquire::Retries \"10\";' >> /etc/apt/apt.conf.d/99retries"
        sudo sh -c "echo 'Acquire::http::Timeout \"240\";' >> /etc/apt/apt.conf.d/99retries"
        sudo sh -c "echo 'Acquire::https::Timeout \"240\";' >> /etc/apt/apt.conf.d/99retries"
        sudo sh -c "echo 'Acquire::By-Hash \"yes\";' >> /etc/apt/apt.conf.d/99retries"

    - name: Install Linux Dependencies
      timeout-minutes: 15
      run: |
        yes | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
        sudo apt-get update
        sudo apt-get -y install --no-install-recommends coccinelle postgresql-server-dev-18

    - name: Checkout TimescaleDB
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run coccinelle
      run: |
        ./scripts/coccinelle.sh

    - name: Save coccinelle.diff
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coccinelle.diff
        path: coccinelle.diff

