name: Check for loader changes
"on":
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

# The loader is only replaced on a PostgreSQL restart, so loader changes must
# stay backward compatible. Changes that add a capability bump
# ts_bgw_loader_api_version in src/loader/bgw_interface.c. Only when the
# extension needs the new loader is MIN_LOADER_API_VERSION in
# src/bgw/launcher_interface.c raised; that forces a restart on upgrade and
# must be acknowledged with the 'upgrade-requires-restart' label.
jobs:
  check_loader_change:
    name: Check for loader changes
    runs-on: runs-on/fleet=linux-2cpu/env=ue1
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract loader versions
        id: versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          get_version() {
            git show "$1:$2" | grep -oP "$3" || echo 0
          }
          api_re='const int32 ts_bgw_loader_api_version = \K\d+'
          min_re='#define MIN_LOADER_API_VERSION \K\d+'

          api_base=$(get_version "$BASE_SHA" src/loader/bgw_interface.c "$api_re")
          api_pr=$(get_version "$HEAD_SHA" src/loader/bgw_interface.c "$api_re")
          min_base=$(get_version "$BASE_SHA" src/bgw/launcher_interface.c "$min_re")
          min_pr=$(get_version "$HEAD_SHA" src/bgw/launcher_interface.c "$min_re")

          echo "ts_bgw_loader_api_version: $api_base -> $api_pr"
          echo "MIN_LOADER_API_VERSION: $min_base -> $min_pr"

          {
            echo "api_base=$api_base"
            echo "api_pr=$api_pr"
            echo "min_base=$min_base"
            echo "min_pr=$min_pr"
          } >> "$GITHUB_OUTPUT"

      - name: Check loader changes against loader versions
        shell: bash --norc --noprofile {0}
        env:
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'upgrade-requires-restart') }}
          API_BASE: ${{ steps.versions.outputs.api_base }}
          API_PR: ${{ steps.versions.outputs.api_pr }}
          MIN_BASE: ${{ steps.versions.outputs.min_base }}
          MIN_PR: ${{ steps.versions.outputs.min_pr }}
        run: |
          failed=false

          if [ "$API_PR" -lt "$API_BASE" ]; then
            echo "Error: ts_bgw_loader_api_version went backwards ($API_BASE -> $API_PR)."
            failed=true
          fi

          if [ "$MIN_PR" -lt "$MIN_BASE" ]; then
            echo "Error: MIN_LOADER_API_VERSION went backwards ($MIN_BASE -> $MIN_PR)."
            failed=true
          fi

          if [ "$MIN_PR" -gt "$API_PR" ]; then
            echo "Error: MIN_LOADER_API_VERSION ($MIN_PR) is greater than"
            echo "ts_bgw_loader_api_version ($API_PR). No loader can satisfy this minimum."
            failed=true
          fi

          if [ "$MIN_PR" -gt "$MIN_BASE" ]; then
            echo "This PR raises MIN_LOADER_API_VERSION ($MIN_BASE -> $MIN_PR). Upgrading to"
            echo "the next TimescaleDB version will require a restart of PostgreSQL."
            if [ "$HAS_LABEL" != "true" ]; then
              echo
              echo "Coordinate the release with the cloud team before merging. Afterwards"
              echo "add the 'upgrade-requires-restart' label to the PR to acknowledge this."
              failed=true
            fi
          elif [ "$HAS_LABEL" = "true" ]; then
            echo "Error: the 'upgrade-requires-restart' label is set but"
            echo "MIN_LOADER_API_VERSION is unchanged ($MIN_BASE). Either raise the minimum"
            echo "or remove the label."
            failed=true
          fi

          if [ "$API_PR" -eq "$API_BASE" ] && \
             ! echo "$BODY" | grep -Eqsi '^disable-check:.*\<loader-change\>'; then
            files=$(gh pr view "$PR_NUMBER" --json files --jq '.files.[].path')
            if echo "${files}" | grep -Eq "^src/loader/.+$"; then
              echo "Warning: This PR changes the loader without bumping"
              echo "ts_bgw_loader_api_version. Loader changes must stay backward compatible."
              echo "Bump the version if the loader gains a capability the extension can"
              echo "depend on, and raise MIN_LOADER_API_VERSION only if the extension"
              echo "requires it."
              echo
              echo "If this change does not alter loader behavior, add this trailer to the"
              echo "pull request message to disable this check:"
              echo
              echo "Disable-check: loader-change"
              echo
              failed=true
            fi
          fi

          if [ "$failed" = true ]; then
            exit 1
          fi
